# ==============================================================================
# Window rules
# Rules combine in order, with later values overriding earlier ones.
# https://docs.noctalia.dev/umbriel/window-rules/d

# Blur windows using the non-optimized path so translucent windows include
# overlapping windows behind them.
[[window_rule]]
blur = true
blur_optimized = true
opacity = 0.80


[[window_rule]]
match.app_id = "^steam_app_default$"
default_workspace = 5

[[window_rule]]
match.app_id = "^dota2$"
default_workspace = 5

[[window_rule]]
match.app_id = "^friends$"
default_floating = true


[[window_rule]]
match.app_id = "^org.kde.dolphin$"
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^nvim$"
default_workspace = 2

[[window_rule]]
match.app_id = "^net.nokyan.Resources$"
opacity = 1
default_floating = true
default_floating_size_px = { width = 1020, height = 900 }

[[window_rule]]
match.app_id = "^google-chrome$"
default_floating = false
opacity = 1

[[window_rule]]
match.app_id = "^dev.zed.Zed$"
default_floating = false
opacity = 0.90
default_workspace = 2

[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = false

[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

[[window_rule]]
match.title = "^(Picture-in-Picture|Picture in picture)$"
default_floating = true
default_maximize = false
default_position = { x = 20, y = 20, anchor = "bottom_right" }

[[window_rule]]
match.title = "^(steam|Friends List)$"
default_floating = true
default_floating_size_px = { width = 600, height = 800 }
opacity = 1

[[window_rule]]
match.title = "^notificationtoasts_.+_desktop"
default_position = { x = 0, y = 0, anchor = "bottom_right" }
default_focused = false
default_pinned = true

